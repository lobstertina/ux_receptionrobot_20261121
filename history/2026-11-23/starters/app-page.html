<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <!-- App 畫面固定 375 寬 -->
    <meta name="viewport" content="width=375, initial-scale=1" />
    <title>A1.1 頁名</title>
    <link rel="stylesheet" href="../assets/shared.css" />
  </head>
  <body>
    <!-- App 頁骨架：複製到 pages/ 改檔名後使用。區塊編號（data-block 屬性與 HTML 註解）為選填，只給程式定位用，不需要對應工程標註卡片；畫面上不顯示任何編號。
         資訊備註模式（殼層右上「資訊備註」）：工程師要個別看標註的畫面區塊，在元素加 data-note-region="區塊 id"（英文小寫＋連字號，同頁不重複；
         同一個 id 可標在多個元素上，框線會包住全部）。id 對到 assets/region-notes/<模組字母>.js 的 regions[].id，寫完跑 node scripts/check-region-notes.cjs。
         一頁通常拆 3～8 個區塊：照使用者會分開理解的單位切（導覽列、篩選列、列表、單一表單欄位、置底操作），不要整頁一塊、也不要每個按鈕一塊。 -->
    <div class="scr">
      <div class="statusbar"></div>

      <!-- 區塊 01 導覽列 -->
      <header class="appbar" data-block="01" data-note-region="appbar">
        <button type="button" class="icon-btn" aria-label="返回" data-wf-back>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
        </button>
        <h1 class="appbar__title">頁面標題</h1>
        <span></span>
      </header>

      <!-- 區塊 02 主要內容 -->
      <!-- .scr__body 的區塊之間自動留 28px，不用再包 .stack，也不要用分隔線分區 -->
      <main class="scr__body" data-block="02">
        <div class="page-head">
          <h2 class="page-head__title">主要標題</h2>
          <p class="page-head__sub">一段擬真的說明文字，描述這一頁要使用者做的事。</p>
        </div>
        <section class="block" aria-labelledby="sec-1">
          <div class="section-head">
            <h3 id="sec-1" class="section-head__title">區塊標題</h3>
            <span class="section-head__meta">輔助資訊</span>
          </div>
          <div class="ph-img" role="img" aria-label="圖片"></div>
        </section>

        <!-- 最小表單骨架：有輸入框的頁一律包在 <form> 裡（Enter＝送出），置底主按鈕用 form= 指到它；
             驗證、錯誤、載入中由頁尾的 WfProto.initForm 掛，頁面不自己寫 submit。
             每個輸入框加 data-wf-field="<欄位 id>" 並在 assets/field-rules.js 的 FIELDS 登記（usedOn 含本頁碼）。
             沒有輸入框的頁：整個 <form> 刪掉，主按鈕改回 type="button" data-wf-code="A1.2"。 -->
        <form class="form" id="form-main" novalidate>
          <div class="field" data-note-region="phone">
            <label class="field__label" for="phone">手機號碼</label>
            <input class="input" id="phone" type="tel" inputmode="numeric" placeholder="例：0912 345 678" data-wf-field="phone" />
          </div>
          <!-- 送出被擋時的表單層級錯誤句（有 n 個欄位需要修改）；只有一個欄位的表單可以拿掉 -->
          <p class="notice notice--error" data-wf-form-error role="alert" hidden></p>
        </form>

        <!-- 同頁狀態：只在 A1.1-2 顯示 -->
        <div class="empty" data-show-when="A1.1-2">
          <div class="empty__icon" aria-hidden="true"></div>
          <p class="empty__title">目前沒有資料</p>
        </div>
      </main>

      <!-- 區塊 03 置底操作：主按鈕 type="submit" form="form-main"＝按下等於送出表單 -->
      <footer class="scr__foot" data-block="03" data-note-region="submit">
        <button type="submit" form="form-main" class="btn btn--primary btn--block" id="submit-main">下一步</button>
      </footer>
      <div class="homebar"></div>
    </div>

    <script src="../assets/proto.js"></script>
    <!-- App 有輸入框的頁：另載模擬鍵盤（鍵盤升起、置底區讓位） -->
    <script src="../assets/proto-keyboard.js"></script>
    <script>
      WfProto.registerPage({
        defaultCode: "A1.1",
        apply: function (code, ctx) {
          // 依頁碼切換畫面；ctx.source === "menu" 時填入該狀態的示範資料
        },
      });

      // 表單行為一次掛好：離開欄位檢查、送出時完整檢查並擋住、通過後按鈕「送出中」＋三點、整表單鎖定 700ms 再換頁
      WfProto.initForm({
        form: "form-main",
        submitBtn: "submit-main",
        fields: [
          // rules：字串＝內建（required）；物件＝{ test, message }，錯誤句寫「要怎麼改」，與 FIELDS 登記的一致
          { id: "phone", rules: ["required", { test: function (v) { return /^09\d{8}$/.test(String(v).replace(/\s/g, "")); }, message: "請輸入 09 開頭的 10 碼手機號碼" }] },
        ],
        loadingLabel: "送出中",
        delay: 700,
        // 以下選填（不寫＝模板預設）：
        // lockForm: true,        載入中整表單鎖定（預設 true；false＝只鎖按鈕）
        // clearOnInput: true,    錯誤出現後一重新輸入就清掉（預設改對才清）
        // blurSkipEmpty: true,   空欄位離開不報錯，送出才報（預設離開就報）
        // gateRules: true,       條件未全過時主按鈕灰但仍可點、點了跑完整驗證（預設永遠不灰）
        onSubmit: function (values) {
          // 測試值分支：登記在 TEST_HINTS 的值走到失敗畫面；其餘回傳下一頁的頁碼（或檔名 "xxx.html"）
          if (values.phone === "0900000000") return "A1.1-3"; // 例：送出失敗的狀態頁
          return "A1.2";
        },
      });
    </script>
  </body>
</html>
