<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <!-- 對話頁（Web）：寬度跟著殼層畫布走；≥1100 左對話／右預覽，較窄時單欄。App 專案見檔尾說明。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>B1.1 對話主頁</title>
    <link rel="stylesheet" href="../assets/shared.css" />
    <style>
      /* 本頁專屬版面：整頁等於視窗高，對話流自己捲、輸入列固定在底部 */
      .chat-page { height: 100vh; display: flex; flex-direction: column; }
      .chat-page .site-main { display: flex; min-height: 0; }
      .chat-layout { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr); min-height: 0; }
      .chat-pane { display: flex; flex-direction: column; min-height: 0; padding: 0 var(--web-x); }
      .chat-pane .chat-feed { padding-top: 24px; padding-bottom: 16px; }
      .chat-pane .chat-composer { padding: 12px 0 16px; border-top: 1px solid var(--line); background: var(--g-0); }
      .chat-preview { display: none; border-left: 1px solid var(--line); padding: 24px; overflow-y: auto; }
      @media (min-width: 1100px) {
        .chat-layout { grid-template-columns: minmax(0, 1fr) 400px; }
        .chat-preview { display: flex; flex-direction: column; gap: 12px; }
      }
    </style>
  </head>
  <body>
    <!-- 對話頁骨架：複製到 pages/ 改檔名後使用。送出 → 使用者泡泡 → 等待文案 → 打字中 → 逐字回覆 → 解鎖，全部由 WfProto.chat 掛。 -->
    <div class="site chat-page">
      <!-- 區塊 01 導覽列 -->
      <header class="site-header" data-block="01">
        <nav class="container topnav" aria-label="主選單">
          <span class="topnav__logo" role="img" aria-label="網站標誌"></span>
          <ul class="topnav__links">
            <li><a href="#" aria-current="page">對話</a></li>
            <li><a href="#" data-wf-toast="已開啟對話紀錄">對話紀錄</a></li>
          </ul>
          <div class="topnav__actions"><button type="button" class="btn btn--sm btn--secondary" data-wf-toast="已開始新對話">新對話</button></div>
        </nav>
      </header>

      <main class="site-main">
        <div class="chat-layout">
          <!-- 區塊 02 對話 -->
          <section class="chat-pane" data-block="02" aria-label="對話">
            <div class="chat-feed" id="chat-feed">
              <div class="bubble bubble--ai">你好，我是你的助理。想先從哪裡開始？</div>
              <!-- 畫面上寫死的歡迎建議：置中（.chips--center）；對話開始後的追問膠囊由 chat.addChoices 加、靠左排 -->
              <div class="chat-choices" id="chat-welcome">
                <div class="chips chips--center">
                  <button type="button" class="chip" data-wf-chat-ask="這個服務可以幫我做什麼？">這個服務可以幫我做什麼？</button>
                  <button type="button" class="chip" data-wf-chat-ask="請詳細說明方案內容">請詳細說明方案內容</button>
                  <button type="button" class="chip" data-wf-chat-ask="我想比較幾個選項">我想比較幾個選項</button>
                </div>
              </div>
            </div>
            <!-- 輸入列：多行輸入 1 行起、最多約 4 行後框內捲；Enter 送出、Shift+Enter 換行；上限由 maxlength 擋、不顯示字數 -->
            <form class="chat-composer" id="chat-composer" novalidate>
              <label class="visually-hidden" for="chat-input">輸入訊息</label>
              <textarea class="chat-composer__input" id="chat-input" rows="1" maxlength="500" placeholder="例：敏感肌適合什麼保養品？" data-wf-field="chat-message"></textarea>
              <!-- 回覆中仍可點的入口加 data-wf-chat-keep（例：掃描商品） -->
              <button type="button" class="icon-btn" aria-label="掃描商品" data-wf-chat-keep data-wf-toast="已開啟相機">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16" /></svg>
              </button>
              <button type="submit" class="btn btn--primary chat-composer__send" id="chat-send">送出</button>
            </form>
          </section>

          <!-- 區塊 03 右側預覽（≥1100 才顯示）：放對話裡提到的商品、報告、摘要 -->
          <aside class="chat-preview" data-block="03" aria-label="預覽">
            <div class="section-head"><h2 class="section-head__title">相關內容</h2></div>
            <div class="ph-img" role="img" aria-label="預覽圖片"></div>
            <p class="text-muted" id="preview-text">對話中提到的內容會顯示在這裡。</p>
          </aside>
        </div>
      </main>
    </div>

    <script src="../assets/proto.js"></script>
    <script>
      WfProto.registerPage({
        defaultCode: "B1.1",
        apply: function (code, ctx) {
          // 依頁碼切換畫面：B1.1-2 回覆中、B1.1-3 完整回覆… 由 ctx.source === "menu" 時用 chat.addBubble 填示範資料
        },
      });

      // 等待文案照專案規格填（這裡是模板預設）：短等待兩段、長等待三段（例：含「詳細／深入」時查知識庫）
      var WAIT_SHORT = [{ text: "正在理解問題", ms: 800 }, { text: "正在整理回答", ms: 900 }];
      var WAIT_LONG = [{ text: "正在理解問題", ms: 900 }, { text: "正在查詢知識庫", ms: 2600 }, { text: "正在整理回答", ms: 1100 }];

      var chat = WfProto.chat.feed("chat-feed", {
        composer: "chat-composer",
        onSend: function (text) { answer(text); },
      });

      // 歡迎建議：點一顆＝送出那句（把它當成使用者打的字）
      document.querySelectorAll("[data-wf-chat-ask]").forEach(function (b) {
        b.addEventListener("click", function () {
          if (chat.isLocked()) return;
          document.getElementById("chat-welcome").remove();
          chat.addBubble("user", WfProto.chat.textToHtml(b.getAttribute("data-wf-chat-ask")));
          answer(b.getAttribute("data-wf-chat-ask"));
        });
      });

      /** 依測試值分支（登記在 TEST_HINTS）：含「失敗」→ 已送出後失敗；含「選項」→ 追問膠囊；含「詳細／深入」→ 長等待 */
      function answer(text) {
        if (/失敗/.test(text)) {
          chat.lockComposer(true);
          chat.waitThen(WAIT_SHORT, function () {
            chat.lockComposer(false);
            chat.addInlineRetry("暫時無法回覆，", "再試一次", function () { answer(text.replace(/失敗/g, "")); });
          });
          return;
        }
        if (/選項/.test(text)) {
          chat.respond("好的，先確認一下你的需求。", {
            wait: WAIT_SHORT,
            done: function () {
              chat.addChoices({
                type: "single",
                options: ["日常保養", "特定問題", "送禮"],
                onPick: function (value) {
                  chat.respond("了解，是「" + value + "」。還有哪些是你在意的？可以多選。", {
                    done: function () {
                      chat.addChoices({
                        type: "multi",
                        title: "在意的地方（可複選）",
                        options: ["價格", "成分", "使用感", "品牌"],
                        confirmLabel: "確認",
                        skip: "先跳過",
                        onPick: function (values) { chat.respond("收到，依「" + values.join("、") + "」整理了幾個方向給你。", { wait: WAIT_LONG }); },
                        onSkip: function () { chat.respond("沒問題，先整理一般的建議給你。", { wait: WAIT_SHORT }); },
                      });
                    },
                  });
                },
              });
            },
          });
          return;
        }
        var long = /詳細|深入|知識庫/.test(text);
        chat.respond(
          long
            ? "這是查過知識庫後的完整說明：\n1. 先確認你的需求與預算。\n2. 依需求挑出 2～3 個方向。\n3. 最後一起比較優缺點，選一個開始。"
            : "好的，我整理一下重點：先確認需求，再挑 2～3 個方向比較，最後選一個開始。",
          { wait: long ? WAIT_LONG : WAIT_SHORT }
        );
      }
    </script>
    <!-- App 專案：把 .chat-feed 放進 .scr__body、<form class="chat-composer"> 放進 .scr__foot，其餘 script 相同；另載 ../assets/proto-keyboard.js -->
  </body>
</html>
